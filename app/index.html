<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아침 루틴 브리프 - 데모</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="phone">
      <header class="top">
        <p class="chip">오늘 아침 브리프</p>
        <h1>지금 나가면 될까?</h1>
        <p id="summary">체감 8°C · 강수 70% · 미세먼지 나쁨</p>
      </header>

      <section class="cards" aria-label="준비물 추천">
        <article class="card high">
          <h2>☔ 우산</h2>
          <p>비 올 확률이 높아요. 우산 챙겨요.</p>
        </article>
        <article class="card high">
          <h2>😷 마스크</h2>
          <p>공기가 탁해요. 마스크 챙기면 좋아요.</p>
        </article>
        <article class="card medium">
          <h2>🧥 겉옷</h2>
          <p>체감온도가 낮아요. 겉옷 추천해요.</p>
        </article>
      </section>

      <section class="touchpoints" aria-label="오늘 터치포인트">
        <h3>오늘의 재방문 포인트</h3>
        <ul>
          <li>07:30 아침 브리프 알림</li>
          <li>08:10 출발 전 체크 알림</li>
          <li>21:30 내일 예고 알림</li>
        </ul>
      </section>

      <button class="cta">앱에서 자세히 보기</button>
    </main>
  </body>
</html>
